# Builds the binaries of a tag and publishes them on its GitHub release, with
# SHA256SUMS and install.sh: the one-line install downloads all three from
# releases/latest/download/.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# On macOS rather than Linux: bin/build.ts signs the two darwin binaries again,
# ad hoc, with codesign, which only macOS has (see signAdHoc there), and Bun
# cross-compiles the Linux ones from here as well as from anywhere. The tests
# run where the repository is developed, too; they need no machine, every
# server they would talk to is faked.
#
# The actions are pinned to a commit: this job holds a token that writes
# releases, and a tag can be moved.
name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand on a branch, `gh workflow run release.yml --ref main`: the
  # same tests, build and check on the runner, and nothing published. The
  # first tag found failures this Mac never showed; a rehearsal costs no tag.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The tag on a release, dev on a run by hand: bin/build.ts accepts
      # nothing else, and a branch name is neither.
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Bun 1.3.11, exactly: the version every test of this repository runs on,
      # and the one the binary was proven with, its compile, its cross-compiling
      # and the BUN_BE_BUN mode the kit's shims rely on (bin/cli/kit.ts). Each
      # binary embeds this runtime: a floating version would change what ships,
      # and what runs the scripts on every workstation, without a commit saying
      # so.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      # What the tests run against, in the log: the runner's image moves, and a
      # failure there is read against these versions.
      - name: Toolchain
        run: |
          sw_vers
          bun --version
          which -a openssl
          openssl version

      - name: Tests
        run: bin/test.sh

      # Builds the dashboard's interface too, once, for the kit every binary
      # carries: its packages come from npm, hence the network this needs.
      - name: Build
        run: bun bin/build.ts --version "$VERSION"

      # The runner is an arm64 Mac: the binary it can start says it carries
      # the tag, and answers without Bun, a configuration or the repository's
      # files, before anything is published. Its kit is proven by
      # bin/tests/e2e/binary.test.ts, which bin/test.sh ran above.
      - name: Check
        run: |
          set -euo pipefail
          test "$(dist/sitesolide-darwin-arm64 --version)" = "sitesolide $VERSION"
          cd "$RUNNER_TEMP"
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/sitesolide-darwin-arm64" --help > /dev/null
          (cd "$GITHUB_WORKSPACE/examples/bun-app" && env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/sitesolide-darwin-arm64" detect --json > /dev/null)

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files="dist/sitesolide-darwin-arm64 dist/sitesolide-darwin-x64 dist/sitesolide-linux-x64 dist/sitesolide-linux-arm64 dist/SHA256SUMS install.sh"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            # Published, never left a draft: releases/latest/download only
            # serves a published release.
            gh release edit "$TAG" --draft=false
          else
            # Created with its files in one call, so that latest/download is
            # never a release without them. A tag with a suffix, v0.3.0-rc.1,
            # is a prerelease, which latest/download never points at.
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" $files --verify-tag --title "$TAG" --generate-notes $prerelease
          fi
