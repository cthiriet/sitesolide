# What the VM adds to the unit of the caddy package, and nothing else.
#
# EnvironmentFile, two files:
#
#   cloudflare.env   the token the DNS module reads to obtain the wildcard
#                    certificate. Read by PID 1, as root, before the drop of
#                    privileges to the caddy account; it stays in 0640
#                    root:caddy.
#   sitesolide.env   the zone served, the contact address of the authority and
#                    the label that carries the slug. The Caddyfile names no
#                    machine: it reads these three variables, which Caddy
#                    substitutes before parsing it. Placed by
#                    bin/deploy-caddy.sh from the configuration of the
#                    workstation, in 0644 root:root, nothing secret appearing
#                    in it.
#
# A Caddyfile that validates without them does not exist: `caddy validate` run
# by hand rejects the configuration, announcing empty addresses, and that
# rejection is not a flaw of the file.
#
# WITHOUT --environ. The unit of the package runs `caddy run --environ`, which
# prints ALL the environment of the service at startup: the Cloudflare token
# ended up in the clear in `journalctl -u caddy`, twice as of 17 September
# 2026. Measured on the bench that same day, see
# the bench results: the Caddyfile validates and loads without
# that option, which serves no other purpose. The empty line resets the
# ExecStart of the package; without it, systemd rejects a second command on a
# Type=notify service.
#
# THE RESTART POLICY. The unit of the package (caddyserver/dist,
# init/caddy.service) sets no Restart= at all, and systemd's default is `no`.
# That, and not the clean exit itself, is why the outage of 11 August 2026
# lasted 23 minutes: `caddy stop` asked the admin API to quit, Caddy told
# systemd STOPPING=1 and exited 0, Result=success, and nothing was configured
# to start it again.
#
# Restart=always restarts the service whatever the way it ended: exit code 0
# or not, signal, timeout, watchdog, OOM. The single exception that matters
# here is a stop asked of systemd itself, `systemctl stop`, a restart, a
# shutdown: PID 1 then marks the stop as manual and does not restart. A
# STOPPING=1 sent by the process does not count as one; it was read in
# src/core/service.c of systemd 257, Debian 13's, where only service_stop()
# forbids the restart. So `caddy stop`, from any account that reaches the admin
# API, now costs a blip of a few seconds instead of an outage, and the monitor
# reports the automatic restart (monitor/README.md). The proof on a test VM is
# written in infra/README.md, "Caddy's restart policy"; nothing is tried on the
# machine that serves the sites.
#
# RestartSec=2s: long enough for the listening sockets of the dead process to
# be released, short enough that a visitor sees a failed request rather than a
# down site.
#
# RestartSteps and RestartMaxDelaySec (systemd 254 and later): a Caddy that
# cannot start, a refused configuration, port 443 taken by an instance started
# by mistake, a missing environment file, is retried after 2, 4, 8, 15 then
# every 30 seconds rather than every 2 seconds for ever, which keeps the
# journal readable. The counter behind those steps, NRestarts, only goes back
# to zero on a start or restart asked of systemd, or a reset-failed: after four
# automatic restarts with none of those in between, every following one waits
# 30 seconds, even months apart. That is still a blip, and
# `sudo systemctl restart caddy` resets it.
#
# StartLimitIntervalSec=0, in [Unit]: never give up. The other choice was a
# start limit that leaves the unit failed and lets the monitor alert, and it was
# refused: the causes of a Caddy that will not start are mostly transient (a
# test instance holding the port, a file being replaced), and the one thing
# worse than an alert is a site that stays down after the cause is gone because
# systemd stopped trying. The monitor alerts all the same, since the unit is not
# active while it waits between two attempts.
#
# Applying it: `sudo systemctl daemon-reload` alone. PID 1 consults Restart=
# and the start limit when the process ends, from the unit as it last loaded
# it, not as it was when the process started: the running Caddy is not
# restarted and keeps its PID. Only the ExecStart above needs a restart to take
# effect, and it is already in force where `systemctl show caddy -p ExecStart`
# names no --environ.
#
# Placed by hand. A restart is required only for ExecStart or EnvironmentFile,
# `sudo systemctl daemon-reload` then `sudo systemctl restart caddy`: a reload
# does not re-read the unit. NEVER `caddy stop` nor `caddy start`, see the
# Production section of CLAUDE.md: the restart above is a blip on every site,
# not a licence.
[Unit]
StartLimitIntervalSec=0

[Service]
EnvironmentFile=/etc/caddy/cloudflare.env
EnvironmentFile=/etc/caddy/sitesolide.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
Restart=always
RestartSec=2s
RestartSteps=4
RestartMaxDelaySec=30s
