# The wall around sitesolide's VM laid again each time nftables.service
# empties the kernel's ruleset: Debian's and Ubuntu's configuration starts
# with `flush ruleset`, and its stop is one. Each line comes after the
# package's own, which this drop-in leaves as they are. The VM keeps running,
# walled again within the same unit job.
#
# Laid by infra/vm/install.sh at /etc/systemd/system/nftables.service.d/,
# harmless on a host that never runs nftables.service. See wall.nft.
[Service]
ExecStartPost=-/usr/sbin/nft -f /etc/sitesolide-vm/wall.nft
ExecReload=-/usr/sbin/nft -f /etc/sitesolide-vm/wall.nft
ExecStopPost=-/usr/sbin/nft -f /etc/sitesolide-vm/wall.nft
